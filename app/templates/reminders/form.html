{% extends "base.html" %}
{% block title %}{{ title }} — Персональная CRM{% endblock %}
{% block content %}
<div class="page-heading"><div><a class="back-link" href="{{ url_for('reminders.index') }}">← Напоминания</a><h1>{{ title }}</h1></div></div>
<form class="panel form-stack" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
        <label>
            Тип <span class="required">*</span>
            <select name="reminder_type" data-reminder-type required>
                <option value="call" {% if reminder.reminder_type == "call" %}selected{% endif %}>Звонок</option>
                <option value="meeting" {% if reminder.reminder_type == "meeting" %}selected{% endif %}>Встреча</option>
            </select>
        </label>
        <label>
            Клиент <span class="required">*</span>
            <select name="client_id" required>
                <option value="">Выберите клиента</option>
                {% for client in clients %}<option value="{{ client.id }}" {% if reminder.client_id == client.id %}selected{% endif %}>{{ client.full_name }}</option>{% endfor %}
            </select>
        </label>
        <label class="span-2">
            Тема <span class="required">*</span>
            <input name="topic" value="{{ reminder.topic or '' }}" required maxlength="250">
        </label>
        <label>
            Дата и время <span class="required">*</span>
            <input name="starts_at" type="datetime-local" required value="{% if reminder.starts_at %}{{ reminder.starts_at|local_datetime('%Y-%m-%dT%H:%M') }}{% endif %}">
        </label>
        <label>
            Уведомить заранее, минут
            <input name="notify_before_minutes" type="number" min="0" step="1" required value="{{ reminder.notify_before_minutes if reminder.notify_before_minutes is not none else 60 }}" list="notify-options">
            <datalist id="notify-options">
                <option value="10">За 10 минут</option>
                <option value="30">За 30 минут</option>
                <option value="60">За час</option>
                <option value="1440">За день</option>
            </datalist>
        </label>
        <div class="span-2 meeting-fields" data-meeting-fields>
            <div class="form-grid">
                <label>
                    Формат встречи
                    <select name="meeting_format">
                        <option value="online" {% if reminder.meeting_format == "online" %}selected{% endif %}>Онлайн</option>
                        <option value="in_person" {% if reminder.meeting_format == "in_person" %}selected{% endif %}>Лично</option>
                    </select>
                </label>
                <label>
                    Место или ссылка
                    <input name="location_or_url" value="{{ reminder.location_or_url or '' }}">
                </label>
            </div>
        </div>
        <label>
            Статус
            <select name="status">{% for value, label in statuses.items() %}<option value="{{ value }}" {% if reminder.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
        </label>
        <label class="span-2">
            Комментарий
            <textarea name="comment" rows="5">{{ reminder.comment or '' }}</textarea>
        </label>
    </div>
    <div class="form-actions">
        <button class="button button-primary" type="submit">Сохранить</button>
        <a class="button button-ghost" href="{{ url_for('reminders.index') }}">Отмена</a>
        {% if reminder.id %}
            <button class="button button-danger-ghost push-right" type="submit" formmethod="post" formaction="{{ url_for('reminders.delete', reminder_id=reminder.id) }}" data-confirm-button="Удалить напоминание?">Удалить</button>
        {% endif %}
    </div>
</form>
{% endblock %}
