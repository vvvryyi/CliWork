{% extends "base.html" %}
{% block title %}Карточка дела — Workspace{% endblock %}
{% block content %}
<div class="page-heading">
    <div><button class="back-link back-button" type="button" data-history-back data-fallback-url="{{ url_for('tasks.all_tasks') }}">← Назад</button><h1>Карточка дела</h1></div>
</div>
<form class="panel form-stack task-panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>
        Название дела
        <input name="text" maxlength="500" required value="{{ request.form.get('text', task.text) }}">
    </label>
    <label>
        Комментарий
        <textarea name="comment" rows="6">{{ request.form.get('comment', task.comment) }}</textarea>
    </label>
    <label>
        Дата исполнения в календаре
        <input name="due_date" type="text" inputmode="numeric" placeholder="ГГ.ММ.ДД" pattern="[0-9]{2}\.[0-9]{2}\.[0-9]{2}" title="Формат: ГГ.ММ.ДД" value="{{ request.form.get('due_date', task.due_date.strftime('%y.%m.%d') if task.due_date else '') }}">
    </label>
    <label class="task-detail-important"><input type="checkbox" name="important" value="1" {% if request.method == 'POST' and request.form.get('important') == '1' or request.method != 'POST' and task.is_important %}checked{% endif %}> Важно</label>
    <div class="form-actions">
        <button class="button button-primary" type="submit">Сохранить</button>
        <a class="button button-ghost" href="{{ url_for('tasks.all_tasks') }}">Отмена</a>
    </div>
</form>
{% endblock %}
