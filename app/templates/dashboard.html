{% extends "base.html" %}
{% block title %}Главная — CRM{% endblock %}
{% block content %}
<div class="stat-grid">
    <a class="stat-card stat-card-compact" href="{{ url_for('tasks.index') }}">
        <span class="stat-value">{{ task_count }}</span>
        <span class="stat-label">Дела</span>
    </a>
    <a class="stat-card {% if overdue_contact_ids %}stat-card-alert{% endif %}" href="{{ url_for('clients.contacts_today') }}">
        <span class="stat-value">{{ contact_count }}</span>
        <span class="stat-label">Связаться сегодня</span>
    </a>
    <a class="stat-card" href="{{ url_for('tasks.all_tasks') }}">
        <span class="stat-value">{{ general_task_count }}</span>
        <span class="stat-label">Все дела</span>
    </a>
</div>

{% endblock %}
