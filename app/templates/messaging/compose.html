{% extends "base.html" %}
{% block title %}Новое сообщение — WorkSpace{% endblock %}
{% block content %}
<div class="page-heading">
    <div>
        <button class="back-link back-button" type="button" data-history-back data-fallback-url="{{ url_for('main.dashboard') }}">← Назад</button>
        <h1>Сообщение</h1>
        <p class="muted">WorkSpace сохранит текст и откроет выбранный канал. Фактическую отправку подтвердите отдельно.</p>
    </div>
</div>

<form method="post" enctype="multipart/form-data" class="panel form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
        <label>
            Клиент <span class="required">*</span>
            <select name="client_id" required>
                <option value="">Выберите клиента</option>
                {% for client in clients %}
                    <option value="{{ client.id }}" {% if selected_client_id == client.id %}selected{% endif %}>{{ client.full_name }}</option>
                {% endfor %}
            </select>
        </label>
    </div>
    {% include 'messaging/_message_fields.html' %}
    <div><button class="button button-primary" type="submit">Подготовить и продолжить</button></div>
</form>
{% endblock %}
