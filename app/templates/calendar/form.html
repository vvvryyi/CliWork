{% extends "base.html" %}
{% block title %}{{ title }} — WorkSpace{% endblock %}
{% block content %}
<div class="page-heading">
    <div class="calendar-form-heading">
        <button class="back-link back-button" type="button" data-history-back data-fallback-url="{{ url_for('calendar.index') }}">← Назад</button>
        <a class="back-link" href="{{ url_for('calendar.index') }}">Календарь</a>
        <h1>{{ title }}</h1>
    </div>
</div>
<form class="panel form-stack calendar-deal-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid calendar-form-grid">
        <label>
            Клиент
            <select name="client_id">
                <option value="">Личное дело</option>
                {% for client in clients %}
                    <option value="{{ client.id }}" {% if request.form.get('client_id', event.client_id|string) == client.id|string %}selected{% endif %}>{{ client.full_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Название дела
            <input name="title" maxlength="250" value="{{ request.form.get('title', event.title or '') }}" placeholder="Обязательно, если клиент не выбран">
        </label>
        <label>
            Вид дела
            <select name="event_type">
                {% for value, label in event_types.items() %}<option value="{{ value }}" {% if request.form.get('event_type', event.event_type) == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
        </label>
        <label>
            <span class="sr-only">Дата дела (ГГММДД)</span>
            <input name="starts_at" type="text" inputmode="numeric" placeholder="ГГММДД" pattern="[0-9]{6}" maxlength="6" title="Формат: ГГММДД" aria-label="Дата дела в формате ГГММДД" required value="{{ request.form.get('starts_at', (event.starts_at|local_datetime('%y%m%d')) if event.starts_at else preset_date.strftime('%y%m%d') if preset_date else '') }}">
        </label>
        <label>
            Комментарий
            <textarea name="comment" rows="5">{{ request.form.get('comment', event.comment or '') }}</textarea>
        </label>
    </div>
    <div class="form-actions">
        <button class="button button-primary" type="submit">Сохранить</button>
        <a class="button button-ghost" href="{{ url_for('calendar.index') }}">Отмена</a>
        {% if event.id %}
            <button class="button button-danger-ghost push-right" type="submit" formmethod="post" formaction="{{ url_for('calendar.delete_event', event_id=event.id) }}" data-confirm-button="Удалить дело?">Удалить</button>
        {% endif %}
    </div>
</form>
{% endblock %}
