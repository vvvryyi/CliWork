{% extends "base.html" %}
{% block title %}{{ title }} — Персональная CRM{% endblock %}
{% block content %}
<div class="page-heading">
    <div><a class="back-link" href="{{ url_for('calendar.index') }}">← Календарь</a><h1>{{ title }}</h1></div>
</div>
<form class="panel form-stack calendar-deal-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid calendar-form-grid">
        <label>
            Клиент
            <select name="client_id">
                <option value="">Личное дело</option>
                {% for client in clients %}
                    <option value="{{ client.id }}" {% if event.client_id == client.id %}selected{% endif %}>{{ client.full_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label>
            Название дела
            <input name="title" maxlength="250" value="{{ event.title or '' }}" placeholder="Обязательно, если клиент не выбран">
        </label>
        <label>
            Вид дела
            <select name="event_type">
                {% for value, label in event_types.items() %}<option value="{{ value }}" {% if event.event_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
            </select>
        </label>
        <label>
            Начало <span class="required">*</span>
            <input name="starts_at" type="datetime-local" max="{{ planning_end.isoformat() }}T23:59" required value="{% if event.starts_at %}{{ event.starts_at|local_datetime('%Y-%m-%dT%H:%M') }}{% elif preset_date %}{{ preset_date.isoformat() }}T09:00{% endif %}">
        </label>
        <label>
            Окончание
            <input name="ends_at" type="datetime-local" max="{{ planning_end.isoformat() }}T23:59" value="{% if event.ends_at %}{{ event.ends_at|local_datetime('%Y-%m-%dT%H:%M') }}{% endif %}">
        </label>
        <label>
            Комментарий
            <textarea name="comment" rows="5">{{ event.comment or "" }}</textarea>
        </label>
    </div>
    <div class="form-actions">
        <button class="button button-primary" type="submit">Сохранить</button>
        <a class="button button-ghost" href="{{ url_for('calendar.index') }}">Отмена</a>
        {% if event.id %}
            <button class="button button-danger-ghost push-right" type="submit" formmethod="post" formaction="{{ url_for('calendar.delete_event', event_id=event.id) }}" data-confirm-button="Удалить дело?">Удалить</button>
        {% endif %}
    </div>
</form>
{% endblock %}
